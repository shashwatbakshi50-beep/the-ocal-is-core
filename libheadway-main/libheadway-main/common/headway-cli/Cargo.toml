[package]
name = "headway-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "Offline PMTiles tileserver and region extractor built on libheadway"

[[bin]]
name = "headway-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive", "env"] }
headway = { path = "../headway" }
serde_json = "1.0.140"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "fs"] }
